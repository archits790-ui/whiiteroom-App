name: Feature Request
description: Suggest an idea or enhancement for Whiiteroom
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting an idea to make Whiiteroom better!
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: A clear and concise description of what feature or enhancement you would like.
    validations:
      required: true
  - type: textarea
    id: problem_solved
    attributes:
      label: What problem does this solve?
      description: Explain the use case or pain point this feature addresses.
    validations:
      required: true
  - type: dropdown
    id: target_platform
    attributes:
      label: Target Platform
      options:
        - Windows
        - Android
        - Both / Cross-Platform
        - macOS / iOS (Roadmap)
    validations:
      required: true
